[project]
name = "connector-fortinet-fortidast"
version = "1.0.0"
description = "Fortinet FortiDAST connector for FortiSOAR"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["dist", "playbooks/playbooks.json"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "ANN", # annotations required
    "FA",  # future annotations required
]
ignore = [
    "ANN401", # Any at the FortiSOAR boundary is unavoidable (config/params dicts)
]

[tool.ruff.lint.per-file-ignores]
# the copyright header line is long by convention
"connector.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
